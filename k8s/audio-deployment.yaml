apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio
  template:
    metadata:
      labels:
        app: audio
    spec:
      containers:
      - name: audio
        image: audio-service:1.0
        ports:
        - containerPort: 5001
        env:
        - name: S3_BUCKET
          value: "my-video-audio-bucket"
        - name: AWS_DEFAULT_REGION
          value: "ap-south-1"
        volumeMounts:
        - name: shared-storage
          mountPath: /data/videos
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: audio-service
spec:
  selector:
    app: audio
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP

