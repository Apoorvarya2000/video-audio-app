apiVersion: v1
kind: Service
metadata:
  name: video-service
spec:
  selector:
    app: video
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: audio-service
spec:
  selector:
    app: audio
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
      nodePort: 30081
  type: NodePort
